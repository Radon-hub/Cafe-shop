
input {
    tcp {
        port => 5000
        codec => json_lines
    }
}

filter {
    mutate {
        add_field => {
            "environment" => "development"
        }
    }
}

output {
    elasticsearch {
        hosts => ["http://elasticsearch:9200"]
        index => "spring-boot-logs-%{+YYYY.MM.dd}"
    }

    stdout {
        codec => rubydebug
    }
}
